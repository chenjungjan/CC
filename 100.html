            { id: 97, cat: 'shopping_pay', jp: 'ホテルまで 送れますか？', cn: '可以送到飯店嗎？', romaji: 'Ho-te-ru ma-de o-ku-re-ma-sen-ka' },
            { id: 98, cat: 'shopping_pay', jp: '空港まで 送れますか？', cn: '可以送到機場嗎？', romaji: 'Kuu-kou ma-de o-ku-re-ma-sen-ka' },
            { id: 99, cat: 'shopping_pay', jp: 'また 来ます。', cn: '我下次再來', romaji: 'Ma-ta ki-ma-su' },
            { id: 100, cat: 'shopping_pay', jp: 'ありがとうございました！', cn: '謝謝您！（購物完成離店時）', romaji: 'A-ri-ga-tou go-zai-ma-shi-ta' }
        ];

        const categories = [
            { id: 'all', name: '全部 (100)', icon: 'fa-list' },
            { id: 'basic', name: '基本禮貌 (1-15)', icon: 'fa-handshake' },
            { id: 'dining_order', name: '用餐點餐 (16-28)', icon: 'fa-utensils' },
            { id: 'dining_custom', name: '飲食客製 (29-42)', icon: 'fa-filter' },
            { id: 'dining_pay', name: '用餐結帳 (43-60)', icon: 'fa-receipt' },
            { id: 'shopping_search', name: '購物試用 (61-75)', icon: 'fa-bag-shopping' },
            { id: 'shopping_pay', name: '免稅結帳 (76-100)', icon: 'fa-credit-card' }
        ];

        // Global State
        let currentCategory = 'all';
        let currentPlaybackSpeed = 0.75;
        let activeAudio = null;
        let playingPhraseId = null;

        // Convert PCM Data to Playable WAV Blob
        function pcmToWav(pcm16Data, sampleRate = 24000, numChannels = 1) {
            const buffer = new ArrayBuffer(44 + pcm16Data.length * 2);
            const view = new DataView(buffer);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16Data.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true); // 16-bit
            writeString(view, 36, 'data');
            view.setUint32(40, pcm16Data.length * 2, true);

            // Write PCM data
            let offset = 44;
            for (let i = 0; i < pcm16Data.length; i++, offset += 2) {
                view.setInt16(offset, pcm16Data[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Call Gemini TTS API or Browser Fallback Web Speech Synthesis
        async function playAudio(phraseId, customSpeed = null) {
            const speed = customSpeed || currentPlaybackSpeed;
            const item = japaneseData.find(d => d.id === phraseId);
            if (!item) return;

            stopAudio();
            playingPhraseId = phraseId;
            updatePlayButtonsState(phraseId, 'loading');

            const cleanText = item.jp.replace(/[〇]/g, 'ナニナニ');

            try {
                // Call Gemini Speech Synthesis API (gemini-2.5-flash-preview-tts)
                const speedInstruction = speed <= 0.6 
                    ? "Speak very slowly and clearly in natural Japanese: " 
                    : (speed <= 0.8 ? "Speak at a clear, comfortable travel pace in natural Japanese: " : "Speak in natural native Japanese: ");

                const payload = {
                    contents: [{
                        parts: [{ text: speedInstruction + cleanText }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: "Kore" } // Clear Japanese voice
                            }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const apiKey = ""; // API key automatically filled in runtime environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Audio Fetch failed");

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType || '';

                if (audioData) {
                    let sampleRate = 24000;
                    const match = mimeType.match(/rate=(\d+)/);
                    if (match) sampleRate = parseInt(match[1], 10);

                    const pcmBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    activeAudio = new Audio(audioUrl);
                    activeAudio.playbackRate = speed <= 0.6 ? 0.85 : 1.0; // Subtle adjustment for pitch comfort
                    
                    activeAudio.onplay = () => updatePlayButtonsState(phraseId, 'playing');
                    activeAudio.onended = () => {
                        updatePlayButtonsState(phraseId, 'idle');
                        playingPhraseId = null;
                        activeAudio = null;
                    };
                    activeAudio.onerror = () => fallbackWebSpeech(cleanText, speed, phraseId);

                    await activeAudio.play();
                } else {
                    fallbackWebSpeech(cleanText, speed, phraseId);
                }
            } catch (err) {
                console.warn("Gemini API audio unavailable, switching to browser Web Speech API fallback...", err);
                fallbackWebSpeech(cleanText, speed, phraseId);
            }
        }

        // Browser Native Web Speech API Fallback
        function fallbackWebSpeech(text, speed, phraseId) {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音播放功能');
                updatePlayButtonsState(phraseId, 'idle');
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = speed;

            utterance.onstart = () => updatePlayButtonsState(phraseId, 'playing');
            utterance.onend = () => {
                updatePlayButtonsState(phraseId, 'idle');
                playingPhraseId = null;
            };
            utterance.onerror = () => {
                updatePlayButtonsState(phraseId, 'idle');
                playingPhraseId = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopAudio() {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (playingPhraseId !== null) {
                updatePlayButtonsState(playingPhraseId, 'idle');
                playingPhraseId = null;
            }
        }

        function updatePlayButtonsState(phraseId, state) {
            const btn = document.getElementById(`play-btn-${phraseId}`);
            if (!btn) return;

            const icon = btn.querySelector('.play-icon');
            if (state === 'loading') {
                icon.className = 'play-icon fa-solid fa-spinner fa-spin text-red-500';
            } else if (state === 'playing') {
                icon.className = 'play-icon fa-solid fa-volume-high text-red-500 animate-pulse';
            } else {
                icon.className = 'play-icon fa-solid fa-volume-low text-slate-600 group-hover:text-red-600';
            }
        }

        function setSpeed(speed) {
            currentPlaybackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.className = 'speed-btn px-2.5 py-1 rounded-lg transition-all hover:bg-white/20';
            });
            
            const activeBtnId = speed === 0.5 ? 'speed-btn-05' : (speed === 0.75 ? 'speed-btn-075' : 'speed-btn-10');
            const activeBtn = document.getElementById(activeBtnId);
            if (activeBtn) {
                activeBtn.className = 'speed-btn px-2.5 py-1 rounded-lg bg-white text-red-600 shadow font-bold transition-all';
            }

            if (playingPhraseId !== null) {
                playAudio(playingPhraseId, speed);
            }
        }

        function setCategory(catId) {
            currentCategory = catId;
            renderCategoryTabs();
            renderPhrases();
        }

        function handleSearch() {
            renderPhrases();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentCategory = 'all';
            renderCategoryTabs();
            renderPhrases();
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = categories.map(cat => {
                const isActive = currentCategory === cat.id;
                return `
                    <button onclick="setCategory('${cat.id}')" 
                            class="whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 ${
                                isActive 
                                ? 'bg-red-600 text-white shadow-sm' 
                                : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                            }">
                        <i class="fa-solid ${cat.icon}"></i>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function renderPhrases() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const showPinyin = document.getElementById('togglePinyin').checked;
            const container = document.getElementById('phrasesContainer');
            const emptyState = document.getElementById('emptyState');

            const filtered = japaneseData.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.cat === currentCategory;
                const matchesSearch = !query || 
                    item.jp.toLowerCase().includes(query) || 
                    item.cn.toLowerCase().includes(query) || 
                    item.romaji.toLowerCase().includes(query) ||
                    item.id.toString() === query;
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filtered.map(item => {
                const isPlaying = playingPhraseId === item.id;
                return `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                        <div>
                            <!-- Header: Number ID and Controls -->
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <span class="px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-500 font-mono text-xs font-semibold">
                                    #${item.id}
                                </span>
                                
                                <div class="flex items-center gap-1">
                                    <!-- Individual Speed Play Buttons -->
                                    <div class="inline-flex rounded-lg bg-slate-100 p-0.5 text-xs text-slate-500">
                                        <button onclick="playAudio(${item.id}, 0.5)" class="px-1.5 py-0.5 hover:bg-white rounded hover:text-red-600 transition-all" title="慢速 0.5x">0.5x</button>
                                        <button onclick="playAudio(${item.id}, 0.75)" class="px-1.5 py-0.5 hover:bg-white rounded hover:text-red-600 transition-all font-medium" title="自然 0.75x">0.75x</button>
                                        <button onclick="playAudio(${item.id}, 1.0)" class="px-1.5 py-0.5 hover:bg-white rounded hover:text-red-600 transition-all" title="全速 1.0x">1.0x</button>
                                    </div>

                                    <!-- Main Play Button -->
                                    <button id="play-btn-${item.id}" onclick="playAudio(${item.id})" 
                                            class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-200 flex items-center justify-center transition-all ml-1 group/btn" 
                                            title="點擊發音">
                                        <i class="play-icon fa-solid ${isPlaying ? 'fa-volume-high text-red-500 animate-pulse' : 'fa-volume-low text-slate-600 group-hover/btn:text-red-600'} text-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Japanese Text -->
                            <div class="japanese-font text-lg sm:text-xl font-bold text-slate-900 leading-snug tracking-wide my-1">
                                ${item.jp}
                            </div>

                            <!-- Chinese Translation -->
                            <div class="text-sm font-medium text-red-600 mb-2">
                                ${item.cn}
                            </div>
                        </div>

                        <!-- Pronunciation / Romaji -->
                        ${showPinyin ? `
                            <div class="pt-2.5 border-t border-slate-100 text-xs text-slate-500 font-mono flex items-center gap-1.5">
                                <i class="fa-solid fa-language text-slate-400"></i>
                                <span>${item.romaji}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initialize App on DOM Load
        window.onload = function() {
            renderCategoryTabs();
            renderPhrases();
        };
    </script>
